<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청년과 가족다양성 기말 대비 포털</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0a0a;
            --surface: #161515;
            --border: #2a2828;
            --accent: #c9a96e;
            --text: #e2ddd5;
            --text-muted: #8e8881;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .lobby-container {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }

        header { margin-bottom: 50px; }
        header h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header h1 span { color: var(--accent); }
        .subtitle { color: var(--text-muted); letter-spacing: 0.1em; font-size: 0.9rem; }

        /* 메인 링크 카드 */
        .portal-link {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 35px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        .portal-link:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: #1f1d1d;
        }

        .week-tag {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }

        .title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .click-hint {
            display: block;
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 0.05em;
        }

        footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="lobby-container">
    <header>
        <p class="subtitle">FINAL EXAM PORTAL</p>
        <h1>청년과 <span>가족다양성</span></h1>
    </header>

    <a href="diversity01.html" class="portal-link">
        <span class="week-tag">WEEK 08-2</span>
        <div class="title">청년의 성과 젠더</div>
        <p class="desc">개념 정의(Sex/Gender/Sexuality), <br>수행 이론 및 실증 데이터 분석</p>
        <span class="click-hint">CLICK TO OPEN ARCHIVE →</span>
    </a>

    <footer>
        &copy; 2026 SNU 기말고사 대비 아카이브
    </footer>
</div>

</body>
</html>
